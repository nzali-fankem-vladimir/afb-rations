# Serveur statique du frontend (Sprint 8.2).
# Le frontend est une application a page unique : nginx ne sert que des
# fichiers, il n'appelle aucun service. Le navigateur parle directement a la
# passerelle (Sprint 8.1), dont le CORS autorise l'origine de cette page.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # En-tetes de securite du serveur. Pas de Content-Security-Policy pour
    # l'instant : elle doit nommer la passerelle et Keycloak, dont les adresses
    # dependent de l'environnement (point a reprendre avec la DSI).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Sonde de sante : repond sans toucher au disque, ni aux journaux.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # La configuration d'execution n'est JAMAIS mise en cache : un changement
    # d'adresse (passerelle, Keycloak) doit se voir au prochain chargement.
    # "expires" et non "add_header" : add_header dans un bloc location annule
    # les en-tetes de securite declares plus haut.
    location = /config.js {
        expires -1;
        try_files $uri =404;
    }

    # Les fichiers de assets/ portent un nom hache par Vite : un contenu modifie
    # change de nom, on peut donc les garder un an.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Toute autre route est une route du routeur React : on rend la page
    # d'entree, jamais un 404 du serveur. Elle-meme n'est pas mise en cache,
    # pour qu'un nouveau deploiement soit vu tout de suite.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
