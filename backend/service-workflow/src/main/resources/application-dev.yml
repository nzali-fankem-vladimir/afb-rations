spring:
  kafka:
    # Seule l'adresse des brokers est reprise par le producteur d'audit
    # (rations-audit-commun) : ses bornes de securite -- max.block.ms en tete --
    # sont fixees par le module et ne doivent pas etre surchargees ici, sous
    # peine de rompre la garantie « l'audit ne fait jamais echouer le metier »
    # (Sprint 1.3, CLAUDE.md section 15).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  datasource:
    url: ${DB_WORKFLOW_URL:jdbc:postgresql://localhost:5433/rations_workflow}
    username: ${DB_WORKFLOW_USERNAME:rations_workflow}
    password: ${DB_WORKFLOW_PASSWORD:changeme-in-development}
  jpa:
    hibernate:
      # Le schema est produit par Flyway (une migration versionnee par service).
      # Hibernate ne fait que verifier la concordance entite <-> table au
      # demarrage : jamais de generation ni de modification automatique
      # (Sprint 2.1, docs/decisions/2026-08-27-tests-repository-et-validation-schema.md).
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # Realm emetteur des jetons. Le service ne fait que les valider :
          # aucun mot de passe stocke, aucune route de login (CLAUDE.md section 10).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/afb-rations-dev}
          audiences: ${KEYCLOAK_AUDIENCE:rations-api}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  identite:
    # Adresse du service Identite, interroge AVANT toute operation sur un
    # processus pour verifier la portee d'acces de l'acteur sur le code unite du
    # dossier (RG-12, GET /identite/habilitation, Sprint 1.3).
    #
    # Le service Workflow est le premier consommateur reel de cet endpoint. Le
    # code_unite n'etant pas dans le jeton Keycloak, ce service ne peut pas
    # trancher seul le cas d'un role a portee locale : l'appel est impose par le
    # modele, pas choisi (docs/appel-habilitation.md section 2).
    #
    # Refus conservateur : si ce service ne repond pas, l'operation est refusee
    # en 503, jamais autorisee par defaut, et jamais servie depuis un cache.
    url: ${IDENTITE_URL:http://localhost:8081}

  pieces-jointes:
    # Racine du stockage des documents de l'etat mensuel (Sprint 4.2, RG-09).
    #
    # LA BASE NE PORTE QUE DES CHEMINS RELATIFS a cette racine
    # (piece_jointe.chemin_fichier). Une racine absolue en base rendrait toute la
    # table fausse le jour ou le volume change de point de montage entre ce poste
    # et Kubernetes ; ici, seule cette ligne change.
    #
    # En production, ce repertoire doit etre un volume PERSISTANT et SAUVEGARDE :
    # il porte les etats signes, seules pieces justificatives des paiements. Le
    # perdre ne casse aucun traitement -- la base garde tout le detail -- mais
    # laisse des lignes piece_jointe qui referencent des fichiers absents.
    # Point a arreter avec la DSI, au meme titre que les Secrets Kubernetes.
    repertoire: ${PIECES_JOINTES_REPERTOIRE:./donnees/pieces-jointes}

  transmission:
    # Adresse du service Transmission, appele a la CLOTURE pour mettre l'etat valide a
    # la disposition de la comptabilite (US-12, endpoint interne du Sprint 5.1,
    # POST /transmission/processus/{id}).
    #
    # L'appel passe par l'API et jamais par une base : le service Transmission n'en a
    # d'ailleurs aucune. C'est LUI qui relit l'en-tete de ce service et le detail du
    # service Saisie, puis publie sur rations.etat.valide (diagramme AR04).
    #
    # Cet appel deroge a la convention 2 s / 3 s des appels sortants : son delai de
    # lecture est de 20 s (ConfigurationTransmission), parce que l'appele enchaine
    # lui-meme trois operations bornees totalisant 17 s au pire. Ce n'est pas un
    # reglage d'environnement, c'est une consequence arithmetique -- d'ou sa presence
    # en Java et non ici.
    url: ${TRANSMISSION_URL:http://localhost:8086}

  saisie:
    # Adresse du service Saisie, interroge pour l'etat mensuel consolide
    # (RG-06, GET /saisie/processus/{id}/etat, docs/appel-consolidation.md).
    #
    # L'appel passe par l'API du service Saisie, jamais par sa base : aucune
    # source de donnees vers rations_saisie n'existe ici, et c'est verifie par
    # la cartographie (critere du guide 4.1).
    url: ${SAISIE_URL:http://localhost:8082}

  integration:
    # Secret partage exige par PUT /processus/{id}/integration, endpoint interne du
    # Sprint 5.2 (DISPOSITIF PROVISOIRE, docs/dispositifs_provisoires.md). Doit valoir
    # exactement app.workflow.cle-interne cote service-transmission.
    #
    # POURQUOI un secret et pas un jeton. Cet appel nait d'un message Kafka : aucun
    # utilisateur n'est derriere lui, il n'y a donc aucun jeton a relayer -- la
    # doctrine du Sprint 1.3 suppose un utilisateur final. Et le realm afb-rations-dev
    # ne porte aucun compte de service (serviceAccountsEnabled: false). L'alternative
    # permitAll a ete ecartee : c'est une ECRITURE sur le statut de paiement d'un etat,
    # pas une lecture de documentation.
    #
    # Sa valeur n'apparait dans AUCUN journal, message d'erreur ou evenement d'audit,
    # ni ici ni cote Transmission -- pas meme sous forme de longueur ou de prefixe. Un
    # test de garde le verifie dans les deux services.
    #
    # A remplacer par un compte de service le jour ou la DSI en ouvre un
    # (docs/points-en-attente.md).
    cle-interne: ${INTEGRATION_CLE_INTERNE:changeme-in-development}

logging:
  level:
    root: INFO
    cm.afrilandfirstbank.rations.workflow: DEBUG
