spring:
  kafka:
    # Seule l'adresse des brokers est reprise par le producteur d'audit : ses
    # bornes de securite (max.block.ms notamment) sont fixees par le module
    # rations-audit-commun et ne doivent pas etre surchargees ici, sous peine de
    # rompre la garantie « l'audit ne fait jamais echouer le metier » (Sprint 1.3).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  datasource:
    url: ${DB_SAISIE_URL:jdbc:postgresql://localhost:5433/rations_saisie}
    username: ${DB_SAISIE_USERNAME:rations_saisie}
    password: ${DB_SAISIE_PASSWORD:changeme-in-development}
  jpa:
    hibernate:
      # Le schema est produit par Flyway (une migration versionnee par service).
      # Hibernate ne fait que verifier la concordance entite <-> table au
      # demarrage : jamais de generation ni de modification automatique
      # (Sprint 2.1, docs/decisions/2026-08-27-tests-repository-et-validation-schema.md).
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # Realm emetteur des jetons. Le service ne fait que les valider :
          # aucun mot de passe stocke, aucune route de login (CLAUDE.md section 10).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/afb-rations-dev}
          audiences: ${KEYCLOAK_AUDIENCE:rations-api}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  grilles:
    # Adresse du service Grilles, interroge AVANT de figer chaque ligne de
    # prestation pour connaitre le montant applicable (RG-03, GET /grilles/active).
    # Appel direct en developpement ; en environnement partage, cette valeur
    # passera par la passerelle ou par le nom de service Kubernetes, sans
    # changement de code.
    #
    # L'appel passe par l'API du service Grilles, jamais par sa base : aucune
    # source de donnees vers rations_grilles n'existe ici, et c'est verifie par
    # la cartographie (Sprint 3.2).
    url: ${GRILLES_URL:http://localhost:8083}

  identite:
    # Adresse du service Identite, interroge AVANT toute ecriture et toute
    # consultation de fiche pour verifier la portee d'acces de l'agent sur le
    # code unite du dossier (RG-12, GET /identite/habilitation, Sprint 1.3).
    #
    # Le code_unite n'est pas dans le jeton Keycloak : ce service ne peut pas
    # trancher seul le cas d'un role a portee locale, l'appel est impose par le
    # modele, pas choisi (docs/appel-habilitation.md section 2).
    url: ${IDENTITE_URL:http://localhost:8081}

  workflow:
    # Adresse du service Workflow, interroge a CHAQUE ecriture pour savoir si
    # l'etat mensuel est encore modifiable, et pour obtenir le code unite et la
    # periode du processus (docs/rattachement-processus.md sections 3 et 4).
    #
    # Ce service existe depuis le Sprint 4.1 : il doit tourner pour que la saisie
    # fonctionne. S'il n'ecoute pas, toute ecriture est refusee en 503 — refus
    # conservateur, et c'est le comportement voulu.
    #
    # Le bouchon de developpement (profil bouchon-workflow, Sprint 3.3) a ete
    # supprime au Sprint 4.1, sa raison d'etre ayant disparu.
    url: ${WORKFLOW_URL:http://localhost:8084}

logging:
  level:
    root: INFO
    cm.afrilandfirstbank.rations.saisie: DEBUG
