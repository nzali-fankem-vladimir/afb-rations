spring:
  kafka:
    # Seule l'adresse des brokers est reprise par le producteur d'audit : ses
    # bornes de securite (max.block.ms notamment) sont fixees par le module
    # rations-audit-commun et ne doivent pas etre surchargees ici, sous peine de
    # rompre la garantie « l'audit ne fait jamais echouer le metier ».
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  datasource:
    url: ${DB_IDENTITE_URL:jdbc:postgresql://localhost:5433/rations_identite}
    username: ${DB_IDENTITE_USERNAME:rations_identite}
    password: ${DB_IDENTITE_PASSWORD:changeme-in-development}
  flyway:
    enabled: true
    # db/dev n'est charge qu'en developpement : les profils de test n'existent
    # dans aucun autre environnement.
    locations: classpath:db/migration,classpath:db/dev
    baseline-on-migrate: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Realm emetteur des jetons. Le module ne fait que les valider :
          # aucun mot de passe stocke, aucune route de login (CLAUDE.md section 10).
          # L'URL du realm de production reste un point en attente DSI.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/afb-rations-dev}
          audiences: ${KEYCLOAK_AUDIENCE:rations-api}

logging:
  level:
    root: INFO
    cm.afrilandfirstbank.rations.identite: DEBUG
